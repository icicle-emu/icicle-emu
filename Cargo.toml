[workspace]
resolver = "2"
members = [
    "icicle-cpu",
    "icicle-fuzzing",
    "icicle-gdb",
    "icicle-jit",
    "icicle-linux",
    "icicle-mem",
    "icicle-test",
    "icicle-vm",
    "afl-icicle-trace",
]
default-members = ["afl-icicle-trace"]

[workspace.dependencies]
anyhow = "1.0.104"
target-lexicon = "0.13.5"
tracing = { version = "0.1.44", default-features = false }
object = { version = "0.40.0", default-features = false, features = ["write", "read_core", "elf"] }
gimli = { version = "0.34.0", features = ["endian-reader"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
bytemuck = { version = "1", features = ["derive"] }
ahash = "0.8.12"
bitflags = "2.13.2"
indexmap = { version = "2.14.2", features = ["serde"] }
pcode = { path = "./sleigh/pcode" }
sleigh-runtime = { path = "./sleigh/sleigh-runtime" }
sleigh-compile = { path = "./sleigh/sleigh-compile" }

[profile.release]
debug = 1
